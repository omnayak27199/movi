name: Validate MOVI data
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON data
        run: python -m json.tool series/characters.json > /dev/null && python -m json.tool series/episodes.json > /dev/null
      - name: Install and run CLI validation
        run: python -m pip install -e . && movi validate && movi plan 1
